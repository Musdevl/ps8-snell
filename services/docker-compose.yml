services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - USER_SERVICE_URL=http://user:8010
      - GAME_SERVICE_URL=http://game:8002
      - FILE_SERVICE_URL=http://files:8001
      - CHAT_SERVICE_URL=http://chat:8003
      - ACHIEVEMENT_SERVICE_URL=http://achievement:8004
      - SHOP_SERVICE_URL=http://shop:8005
      - AI_SERVICE_URL=http://ai:8020
      # La gateway ne lit ses certificats que si ENV=prod. Le volume est
      # monté dans tous les cas : sans effet en dev, prêt à être utilisé en
      # prod des que le projet aura un domaine + certificats valides.
      - ENV=${ENV:-dev}
      - GATEWAY_URL=http://gateway:8000
    volumes:
      - ../secrets/https:/app/https:ro
    networks:
      - app-network
      - proxy

  game:
    build:
      context: .
      dockerfile: game/Dockerfile
    environment:
      - GATEWAY_URL=${GATEWAY_INTERNAL_URL:-http://gateway:8000}
      - USER_SERVICE_URL=http://user:8010
      - CHAT_SERVICE_URL=http://chat:8003
      - AI_SERVICE_URL=http://ai:8020
      - ACHIEVEMENT_SERVICE_URL=http://achievement:8004
      - GAME_SERVICE_URL=http://game:8002
      - MONGO_DB_URL=mongodb://mongodb:27017
    networks:
      - app-network

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_DB_URL=mongodb://mongodb:27017
      - GATEWAY_URL=${GATEWAY_INTERNAL_URL:-http://gateway:8000}
      - PUBLIC_GATEWAY_URL=${PUBLIC_URL}
      - GAME_SERVICE_URL=http://game:8002
      - CHAT_SERVICE_URL=http://chat:8003
      - ACHIEVEMENT_SERVICE_URL=http://achievement:8004
      - MAIL_SERVICE_URL=http://mail:8006
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - ENV=${ENV:-dev}
    networks:
      - app-network

  files:
    build:
      context: .
      dockerfile: files/Dockerfile
    networks:
      - app-network

  chat:
    build:
      context: .
      dockerfile: chat/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_DB_URL=mongodb://mongodb:27017
      - GATEWAY_URL=${GATEWAY_INTERNAL_URL:-http://gateway:8000}
      - USER_SERVICE_URL=http://user:8010
      - GAME_SERVICE_URL=http://game:8002
    networks:
      - app-network

  achievement:
    build:
      context: .
      dockerfile: achievement/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_DB_URL=mongodb://mongodb:27017
      - GATEWAY_URL=http://gateway:8000
      - USER_SERVICE_URL=http://user:8010
    networks:
      - app-network

  shop:
    build:
      context: .
      dockerfile: shop/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_DB_URL=mongodb://mongodb:27017
      - GATEWAY_URL=http://gateway:8000
      - USER_SERVICE_URL=http://user:8010
    networks:
      - app-network

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    environment:
      - GATEWAY_URL=http://gateway:8000
    networks:
      - app-network

  mail:
    build:
      context: .
      dockerfile: mail/Dockerfile
    ports:
      - "127.0.0.1:8006:8006"
    volumes:
      - ./mail/config.yaml:/app/mail/config.yaml:ro
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    container_name: mongodb
    command: mongod --quiet --logpath /dev/null
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: bridge
  proxy:
    external: true

volumes:
  mongodb_data: