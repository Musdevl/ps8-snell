services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - USER_SERVICE_URL=http://user:8010
      - GAME_SERVICE_URL=http://game:8002
      - FILE_SERVICE_URL=http://files:8001
      - CHAT_SERVICE_URL=http://chat:8003
      - ACHIEVEMENT_SERVICE_URL=http://achievement:8004
      - SHOP_SERVICE_URL=http://shop:8005
      - ENV=${ENV:-dev} # Valeur par default "dev" sinon la valeur dans la var d'env ENV
      - GATEWAY_URL=https://gateway:8000

    volumes:
      - ../../secrets/https:/app/https:ro # ro veut dire readonly
    networks:
      - app-network

  game:
    build:
      context: .
      dockerfile: game/Dockerfile

    environment:
      - GATEWAY_URL=https://gateway:8000
      - USER_SERVICE_URL=http://user:8010
      - CHAT_SERVICE_URL=http://chat:8003
      - ACHIEVEMENT_SERVICE_URL=http://achievement:8004
      - GAME_SERVICE_URL=http://game:8002
      - MONGO_DB_URL=mongodb://mongodb:27017
      
    networks:
      - app-network

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_DB_URL=mongodb://mongodb:27017
      - GATEWAY_URL=https://gateway:8000
      - PUBLIC_GATEWAY_URL=https://localhost:8000
      - GAME_SERVICE_URL=http://game:8002
      - CHAT_SERVICE_URL=http://chat:8003
      - ACHIEVEMENT_SERVICE_URL=http://achievement:8004
      # - STRIPE_SECRET_KEY=private
    networks:
      - app-network

  files:
    build:
      context: .
      dockerfile: files/Dockerfile
    networks:
      - app-network

  chat:
    build:
      context: .
      dockerfile: chat/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_DB_URL=mongodb://mongodb:27017
      - GATEWAY_URL=https://gateway:8000
      - USER_SERVICE_URL=http://user:8010
      - GAME_SERVICE_URL=http://game:8002
    networks:
      - app-network

  achievement:
    build:
      context: .
      dockerfile: achievement/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_DB_URL=mongodb://mongodb:27017
      - GATEWAY_URL=https://gateway:8000
      - USER_SERVICE_URL=http://user:8010
    networks:
      - app-network

  shop:
    build:
      context: .
      dockerfile: shop/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_DB_URL=mongodb://mongodb:27017
      - GATEWAY_URL=https://gateway:8000
      - USER_SERVICE_URL=http://user:8010
    networks:
      - app-network


  ai:
    build:
      context: .
      dockerfile: AI/Dockerfile
    environment:
      - GATEWAY_URL=https://gateway:8000
    networks:
      - app-network


  mongodb:
    image: mongo:latest
    container_name: mongodb
    command: mongod --quiet --logpath /dev/null
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s


networks:
  app-network:
    driver: bridge