<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snell - Monitoring</title>
    <style>
        :root {
            --bg: #0d0f11;
            --ink: #e6e8ea;
            --ink-dim: #9aa3ab;
            --ink-mute: #6b747c;
            --rule: #1e2429;
            --accent: #2f81f7;
            --ok: #3fb950;
            --warn: #d29922;
            --crit: #f85149;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 16px 20px 40px;
            background: var(--bg);
            color: var(--ink);
            font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-variant-numeric: tabular-nums;
        }

        /* ── En-tête ─────────────────────────────────────────────────────── */

        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--rule);
        }

        header h1 {
            margin: 0;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        header .meta { color: var(--ink-mute); }

        /* ── Bandeau de compteurs ────────────────────────────────────────── */

        .kpis {
            display: flex;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--rule);
        }

        .kpi {
            flex: 1 1 130px;
            padding: 14px 20px 14px 0;
            margin-right: 20px;
            border-right: 1px solid var(--rule);
        }

        .kpi:last-child { border-right: 0; }

        .kpi .label {
            color: var(--ink-mute);
            font-size: 10px;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .kpi .value {
            font-size: 26px;
            line-height: 1.25;
            font-weight: 500;
        }

        .kpi .unit {
            font-size: 13px;
            color: var(--ink-dim);
        }

        /* ── Sections ────────────────────────────────────────────────────── */

        section { margin-top: 26px; }

        h2 {
            margin: 0 0 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--rule);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--ink-dim);
        }

        .cols {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
        }

        .cols > * { flex: 1 1 360px; }

        /* ── Tableaux ────────────────────────────────────────────────────── */

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 0 12px 5px 0;
            text-align: left;
            font-weight: 400;
            font-size: 10px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--ink-mute);
        }

        td {
            padding: 5px 12px 5px 0;
            border-top: 1px solid var(--rule);
            white-space: nowrap;
        }

        td.num, th.num { text-align: right; padding-right: 16px; }

        .dim { color: var(--ink-dim); }
        .mute { color: var(--ink-mute); }

        /* ── Jauges ──────────────────────────────────────────────────────── */

        .gauge { display: flex; align-items: center; gap: 12px; padding: 7px 0; }
        .gauge .name { width: 46px; color: var(--ink-dim); }
        .gauge .track { flex: 1; height: 4px; background: var(--rule); }
        .gauge .fill { height: 100%; background: var(--ok); }
        .gauge .read { width: 190px; text-align: right; }

        .fill.warn { background: var(--warn); }
        .fill.crit { background: var(--crit); }

        /* Jauge compacte, dans une cellule de tableau */
        .bar { display: inline-block; width: 54px; height: 4px; background: var(--rule); vertical-align: middle; }
        .bar > i { display: block; height: 100%; background: var(--accent); }

        /* ── Série d'inscriptions ────────────────────────────────────────── */

        .series {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 74px;
            padding-top: 14px;
        }

        .series .day { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
        .series .col { background: var(--accent); border-radius: 2px 2px 0 0; min-height: 1px; }
        .series .col.empty { background: var(--rule); }
        .series .top { font-size: 10px; color: var(--ink-dim); text-align: center; padding-bottom: 3px; }

        .series-axis { display: flex; gap: 6px; padding-top: 5px; border-top: 1px solid var(--rule); }
        .series-axis span { flex: 1; text-align: center; font-size: 10px; color: var(--ink-mute); }

        /* ── États ───────────────────────────────────────────────────────── */

        .dot { display: inline-block; width: 6px; height: 6px; margin-right: 7px; vertical-align: 1px; background: var(--ink-mute); }
        .dot.up { background: var(--ok); }
        .dot.down { background: var(--crit); }

        .error { color: var(--crit); }
    </style>
</head>

<body>
    <header>
        <h1>Snell &middot; monitoring</h1>
        <span class="meta">maj <span id="clock">--:--:--</span> &middot; 3s</span>
    </header>

    <div class="kpis" id="kpis"></div>

    <div class="cols">
        <section>
            <h2>Inscriptions &mdash; 7 derniers jours</h2>
            <div id="registrations" class="mute">chargement</div>
        </section>

        <section>
            <h2>Serveur</h2>
            <div id="system" class="mute">chargement</div>
        </section>
    </div>

    <section>
        <h2>Containers</h2>
        <div id="containers" class="mute">chargement</div>
    </section>

    <script type="module">
        import { GATEWAY_URL } from '../env.js';

        // Les stats containers coûtent ~1s côté Docker : on rafraîchit doucement.
        const REFRESH_MS = 3000;

        // Dernières valeurs connues : le bandeau se redessine d'un bloc, mais ses
        // compteurs viennent de deux routes qui ne répondent pas en même temps.
        const kpis = { online: null, total: null, today: null, load: null, memory: null };

        async function get(path) {
            const res = await fetch(`${GATEWAY_URL}/api/admin${path}`);
            if (!res.ok) throw new Error(`${path} → ${res.status}`);
            return await res.json();
        }

        function render(id, html) {
            document.getElementById(id).innerHTML = html;
        }

        function fail(id, error) {
            render(id, `<span class="error">indisponible — ${error.message}</span>`);
        }

        function mo(bytes) {
            return `${Math.round(bytes / 1024 / 1024)} Mo`;
        }

        // Vert / ambre / rouge : un taux d'occupation est un état, pas une identité.
        function level(percent) {
            if (percent >= 85) return 'crit';
            if (percent >= 70) return 'warn';
            return '';
        }

        function gauge(name, percent, reading) {
            return `<div class="gauge">
                <span class="name">${name}</span>
                <span class="track"><span class="fill ${level(percent)}" style="width:${Math.min(percent, 100)}%"></span></span>
                <span class="read dim">${reading}</span>
            </div>`;
        }

        function renderKpis() {
            const cells = [
                { label: 'users connectés', value: kpis.online },
                { label: 'inscrits', value: kpis.total },
                { label: "inscrits aujourd'hui", value: kpis.today },
                { label: 'charge cpu', value: kpis.load, unit: '%' },
                { label: 'mémoire', value: kpis.memory, unit: '%' },
            ];

            render('kpis', cells.map(cell => `
                <div class="kpi">
                    <div class="label">${cell.label}</div>
                    <div class="value">${cell.value ?? '—'}${cell.unit && cell.value !== null ? `<span class="unit">${cell.unit}</span>` : ''}</div>
                </div>`).join(''));
        }

        function renderSeries(data) {
            // Hauteur relative au pic de la période : sans référence commune, deux
            // barres de même hauteur ne voudraient pas dire la même chose.
            const peak = Math.max(...data.perDay.map(day => day.count), 1);

            render('registrations', `
                <div class="series">
                    ${data.perDay.map(day => `
                        <div class="day" title="${day.date} — ${day.count} inscription(s)">
                            <div class="top">${day.count || ''}</div>
                            <div class="col ${day.count ? '' : 'empty'}" style="height:${(day.count / peak) * 100}%"></div>
                        </div>`).join('')}
                </div>
                <div class="series-axis">
                    ${data.perDay.map(day => `<span>${day.date.slice(8)}/${day.date.slice(5, 7)}</span>`).join('')}
                </div>
                <div class="mute" style="padding-top:8px">
                    total ${data.total} &middot; période ${data.period} &middot; pic ${peak}/jour
                </div>`);
        }

        async function refresh() {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString();

            get('/online')
                .then(data => { kpis.online = data.count; renderKpis(); })
                .catch(() => { kpis.online = null; renderKpis(); });

            get('/registrations?days=7')
                .then(data => {
                    kpis.total = data.total;
                    kpis.today = data.today;
                    renderKpis();
                    renderSeries(data);
                })
                .catch(error => fail('registrations', error));

            get('/system')
                .then(data => {
                    kpis.load = data.load.percent;
                    kpis.memory = data.memory.percent;
                    renderKpis();

                    render('system', `
                        ${gauge('cpu', data.load.percent, `${data.load.percent}% de ${data.cpus} coeurs`)}
                        ${gauge('ram', data.memory.percent, `${mo(data.memory.used)} / ${mo(data.memory.total)}`)}
                        <table style="margin-top:10px">
                            <tr><td class="dim">uptime</td><td>${Math.floor(data.uptime / 86400)}j ${Math.floor(data.uptime % 86400 / 3600)}h</td></tr>
                            <tr><td class="dim">load avg</td><td>${data.load['1m']} &middot; ${data.load['5m']} &middot; ${data.load['15m']} <span class="mute">(1/5/15 min)</span></td></tr>
                        </table>`);
                })
                .catch(error => fail('system', error));

            // Deux routes séparées : la liste est instantanée, les stats non.
            Promise.all([get('/containers'), get('/containers/stats')])
                .then(([list, stats]) => {
                    const byId = new Map(stats.containers.map(container => [container.id, container]));

                    render('containers', `
                        <table>
                            <tr>
                                <th>service</th>
                                <th>état</th>
                                <th class="num">cpu</th>
                                <th>&nbsp;</th>
                                <th class="num">ram</th>
                                <th>image</th>
                            </tr>
                            ${list.containers.map(container => {
                                const stat = byId.get(container.id);
                                const cpu = stat ? stat.cpu.percent : null;

                                return `<tr>
                                    <td><span class="dot ${container.running ? 'up' : 'down'}"></span>${container.name}</td>
                                    <td class="${container.running ? 'dim' : 'error'}">${container.status}</td>
                                    <td class="num">${cpu === null ? '<span class="mute">—</span>' : cpu + ' %'}</td>
                                    <td><span class="bar"><i style="width:${Math.min(cpu || 0, 100)}%"></i></span></td>
                                    <td class="num">${stat ? mo(stat.memory.usage) : '<span class="mute">—</span>'}</td>
                                    <td class="mute">${container.image}</td>
                                </tr>`;
                            }).join('')}
                        </table>`);
                })
                .catch(error => fail('containers', error));
        }

        renderKpis();
        refresh();
        setInterval(refresh, REFRESH_MS);
    </script>
</body>

</html>
