<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Snell Game Tutorial</title>
    <link rel="stylesheet" href="/pages/game/shared/game.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/pages/game/tutorial/tutorial.css">
    <script type="module" src="/pages/game/puzzles/game.js"></script>
    <script type="module" src="/components/board/board.js"></script>
    <script type="module" src="/components/player-info/player-info.js"></script>
    <script type="module" src="/components/notification/notification.js"></script>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
     <script type="module" src="https://cdn.jsdelivr.net/npm/@capacitor/core@7.2.0/dist/capacitor.min.js"></script>
</head>

<body>
    <button class="leave-btn option-btn">
        <span class="leave-text">Leave</span>
        <svg class="mobile-leave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 19-7-7 7-7"></path>
            <path d="M19 12H5"></path>
        </svg>
    </button>
    
    <div class="game-container">
        <div class="game-box">
            <main>
                <player-info class="black player-info"></player-info>
                <game-board></game-board>
                <player-info class="white player-info"></player-info>
            </main>
        </div>
    </div>

    <div id="game-modal" class="option-container">
        <div class="option-box">
            <p id="modal-message"></p>
            <div class="option-btn-container">
                <button id="modal-confirm" class="confirm-btn option-btn"></button>
                <button id="modal-cancel" class="cancel-btn option-btn">Cancel</button>
            </div>
        </div>
    </div>

    <section class="tutorial-container">
        <div class="tutorial-wrapper">
            <img src="/assets/coachmae.png" class="coachmae" alt="coachmae">
            <div class="tutorial-content">
                <p id="tutorial-message"></p>
                <div class="tutorial-btn-container">
                    <button class="previous-btn option-btn">Previous</button>
                    <button class="next-btn option-btn">Next</button>
                </div>
            </div>
        </div>
    </section>

    <notification-bar></notification-bar>

</body>

</html>
