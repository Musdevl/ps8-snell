<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Snell Multiplayer Game</title>
    <link rel="stylesheet" href="/pages/game/shared/game.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/pages/game/multiplayer-game/waiting-page.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <script type="module" src="/pages/game/multiplayer-game/game.js"></script>
    <script type="module" src="/components/board/board.js"></script>
    <script type="module" src="/components/player-info/player-info.js"></script>
    <script type="module" src="/components/end-message/end-message.js"></script>
    <script type="module" src="/components/chat/chat.js"></script>
    <script type="module" src="/components/notification/notification.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@capacitor/core@7.2.0/dist/capacitor.min.js"></script>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">

</head>

<body>
    <button class="leave-btn option-btn">
        <span class="leave-text">Leave</span>
        <svg class="mobile-leave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 19-7-7 7-7"></path>
            <path d="M19 12H5"></path>
        </svg>
    </button>
    <button class="chat-btn">
        <svg class="mobile-chat" xmlns="http://www.w3.org/2000/svg" data-glyph="message-bubble-fill-left"
            aria-hidden="true" viewBox="0 0 24 24">
            <path
                d="M4.83,21.9 l-3.13,1.7 c-1.17,0.63,-1.57,-0.43,-1.27,-1.03 l1.4,-2.73 c0.47,-0.9,0.4,-1.6,-0.23,-2.4 c-1,-1.57,-1.57,-3.4,-1.57,-5.43 c0,-6,5.1,-10.5,11.97,-10.5 c6.87,0,11.97,4.5,11.97,10.5 c0,6,-5.1,10.5,-11.97,10.5 c-1.63,0,-3.17,-0.27,-4.57,-0.73 c-0.97,-0.4,-1.7,-0.33,-2.6,0.13 Z M4.83,21.9"
                fill="currentColor">
            </path>
        </svg>
    </button>

    <div class="game-container">
        <div class="game-box">
            <main class="chess-tray">
                <player-info class="black player-info"></player-info>
                <game-board></game-board>
                <player-info class="white player-info"></player-info>
            </main>
        </div>
        <section class="chat-container">
            <div class="mobile-chat-leave">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 19-7-7 7-7"></path>
                    <path d="M19 12H5"></path>
                </svg>
            </div>
            <chat-component></chat-component>
        </section>
    </div>
    <end-message></end-message>
    <section class="waiting-section">
        <h1>Waiting for players</h1>
        <div class="dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </section>



    <div id="game-modal" class="option-container">
        <div class="option-box">
            <p id="modal-message"></p>
            <div class="option-btn-container">
                <button id="modal-confirm" class="confirm-btn option-btn"></button>
                <button id="modal-cancel" class="cancel-btn option-btn">Cancel</button>
            </div>
            <div class="option-waiting">
                <div class="dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </div>

    <notification-bar></notification-bar>

    <div class="start-animation-container">
        <div class="black-animation">
            <img src="" alt="black-picture" id="black-animation-picture" class="animation-picture">
            <span id="black-username" class="animation-username"></span>
        </div>
        <svg class="vs-ico" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feOffset dx="0" dy="4" in="SourceAlpha" />
                    <feGaussianBlur stdDeviation="0" result="blur" />
                    <feFlood flood-color="#455f2c" />
                    <feComposite in2="blur" operator="in" />
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
            </defs>

            <g font-family="sans-serif" font-weight="900" text-anchor="middle">

                <g filter="url(#shadow)">
                    <text class="vs-text" x="200" y="100" fill="#769656" stroke="#769656" stroke-width="15"
                        stroke-linejoin="round">VS</text>
                    <text class="vs-text" x="200" y="100" fill="white">VS</text>
                </g>

                <g filter="url(#shadow)" transform="translate(0, 10)">
                    <text class="match-text" x="200" y="130" fill="#769656" stroke="#769656" stroke-width="8"
                        stroke-linejoin="round" letter-spacing="1">MATCH START</text>
                    <text class="match-text" x="200" y="130" fill="white" letter-spacing="1">MATCH START</text>
                </g>
            </g>
        </svg>


        <div class="white-animation">
            <img src="" alt="white-picture" id="white-animation-picture" class="animation-picture">
            <span id="white-username" class="animation-username"></span>
        </div>
    </div>
</body>

</html>
