<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Snell - AI</title>
    <link rel="stylesheet" href="/pages/ais/style.css">
    <script type="module" src="/pages/ais/app.js"></script>
    <script type="module" src="/components/social-bar/social-bar.js"></script>
    <script type="module" src="/components/notification/notification.js"></script>
    <script type="module" src="/components/nav-bar/nav-bar.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@capacitor/core@7.2.0/dist/capacitor.min.js"></script>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
</head>

<body>

    <social-bar id="social-section"></social-bar>

    <main>
        <section class="global-container">
            <div class="ai-header-section-mobile">
                <svg class="leave-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 19-7-7 7-7"></path>
                    <path d="M19 12H5"></path>
                </svg>
                <div class="ai-mobile-header">
                    <img class="wave" src="/assets/wave.svg" alt="wage-img">
                    <p class="section-title-mobile">AIs</p>
                    <img class="ai-header-ico" src="/assets/bot.svg" alt="ai-piece">
                </div>
            </div>

            <div class="ai-header-section">
                <svg class="leave-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 19-7-7 7-7"></path>
                    <path d="M19 12H5"></path>
                </svg>
                <p class="section-title">AIs</p>
            </div>

            <section class="search-section">
                <input type="text" class="search-ais" placeholder="Search an ai" autocomplete="off">
                <button class="search-ai-btn">
                    <img src="/assets/magnifying-glass.svg" class="search-ico" alt="magnifying-glass-ico">
                    <span class="btn-label">Search</span>
                </button>
            </section>
            <div class="ais"></div>
        </section>

    </main>

    <nav-bar></nav-bar>

    <notification-bar></notification-bar>
</body>

</html>
