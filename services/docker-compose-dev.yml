services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - USER_SERVICE_URL=http://user:8010
      - GAME_SERVICE_URL=http://game:8002
      - FILE_SERVICE_URL=http://files:8001
      - CHAT_SERVICE_URL=http://chat:8003
      - ACHIEVEMENT_SERVICE_URL=http://achievement:8004
      - SHOP_SERVICE_URL=http://shop:8005
      - AI_SERVICE_URL=http://ai:8020
      - ENV=${ENV:-dev} # Valeur par default "dev" sinon la valeur dans la var d'env ENV
      - GATEWAY_URL=http://gateway:8000

    volumes:
      - ../../secrets/https:/app/https:ro # ro veut dire readonly
    networks:
      - app-network

  game:
    build:
      context: .
      dockerfile: game/Dockerfile

    environment:
      - GATEWAY_URL=http://gateway:8000
      - USER_SERVICE_URL=http://user:8010
      - CHAT_SERVICE_URL=http://chat:8003
      - AI_SERVICE_URL=http://ai:8020
      - ACHIEVEMENT_SERVICE_URL=http://achievement:8004
      - GAME_SERVICE_URL=http://game:8002
      - MONGO_DB_URL=mongodb://mongodb:27017

    networks:
      - app-network

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_DB_URL=mongodb://mongodb:27017
      - GATEWAY_URL=http://gateway:8000
      - PUBLIC_GATEWAY_URL=http://localhost:8000
      - GAME_SERVICE_URL=http://game:8002
      - CHAT_SERVICE_URL=http://chat:8003
      - ACHIEVEMENT_SERVICE_URL=http://achievement:8004
      - MAIL_SERVICE_URL=http://mail:8006
      - STRIPE_SECRET_KEY=sk_test_51TJA0ZPcFZdexsww9mwlRsG0fkopYeZUAxWmZ8cS0wkmrMQkxVPWt39ypfUMGvmVcSH8482MHZNPfKQ2e6NPgXUt00ITfGopEi

    networks:
      - app-network

  files:
    build:
      context: .
      dockerfile: files/Dockerfile
    networks:
      - app-network

  chat:
    build:
      context: .
      dockerfile: chat/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_DB_URL=mongodb://mongodb:27017
      - GATEWAY_URL=http://gateway:8000
      - USER_SERVICE_URL=http://user:8010
    networks:
      - app-network

  achievement:
    build:
      context: .
      dockerfile: achievement/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_DB_URL=mongodb://mongodb:27017
      - GATEWAY_URL=http://gateway:8000
      - USER_SERVICE_URL=http://user:8010
    networks:
      - app-network

  shop:
    build:
      context: .
      dockerfile: shop/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_DB_URL=mongodb://mongodb:27017
      - GATEWAY_URL=http://gateway:8000
      - USER_SERVICE_URL=http://user:8010
    networks:
      - app-network


  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    environment:
      - GATEWAY_URL=http://gateway:8000
    networks:
      - app-network

  mail:
    build:
      context: .
      dockerfile: mail/Dockerfile
    ports:
      # Exposé en dev uniquement, pour tester un envoi sans passer par un autre
      # service : http://localhost:8006/api/mail/health
      - "8006:8006"
    volumes:
      # Monté plutôt que seulement copié dans l'image : modifier config.yaml puis
      # `docker compose restart mail` suffit, sans reconstruction.
      - ./mail/config.yaml:/app/mail/config.yaml:ro
    networks:
      - app-network

  # Faux serveur SMTP de dev : rien ne sort de la machine, tous les mails
  # envoyés sont consultables dans l'interface web sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "8025:8025"
    networks:
      - app-network


  mongodb:
    image: mongo:latest
    container_name: mongodb
    command: mongod --quiet --logpath /dev/null
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s


networks:
  app-network:
    driver: bridge